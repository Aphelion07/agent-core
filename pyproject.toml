[project]
name = "agent-core"
version = "0.1.0"
description = "A minimal, provider-agnostic agent framework built from scratch, with a benchmark harness that measures agent control strategies against each other instead of assuming one is best."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aphelion07" }]
keywords = ["agents", "llm", "tool-use", "react", "ollama", "evaluation"]

dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
]

[project.scripts]
agent-core = "agent_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_core"]
mypy_path = "src"
strict = true
warn_return_any = false
